# grove — test + typecheck CI (grove#78).
#
# The mechanical backstop the review process structurally can't be: runs
# grove's own test suites and typechecks on every PR (and on push to main),
# independent of whether a grove review flow ran. It catches the cases reviews
# can't — a human-authored PR, an agent that skipped or misreported tests, a
# regression that slipped a review.
#
# GREEN HERE IS NOT APPROVAL — it only proves the code builds and its tests
# pass. Normal review and the maintainer's merge decision still gate the
# merge; this does not displace review, it backstops it.
#
# The six packages are npm workspaces of the repository root (adr-0048 D4), so
# the install is ONE hoisted `npm ci` at the root from the committed
# package-lock.json — never a per-package install. `npm test` is still
# `node --test` and `npm run typecheck` is still `node --check` over the .mjs
# sources; what changed is that grove now declares dependencies at all, and a
# suite that resolves them from an ambient node_modules would prove nothing.

name: grove tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # A push to main (e.g. a direct landing) runs the suites too — the honesty
  # backstop shouldn't depend on a PR having been opened.
  push:
    branches: [main]

# Read-only: it checks out and runs tests; it posts nothing.
permissions:
  contents: read

jobs:
  test:
    name: test — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      # Report all six live suites independently. One failure must not mask
      # another.
      fail-fast: false
      matrix:
        package:
          - tooling/grove/build
          - tooling/grove/release
          - tooling/grove/tests/gates
          - tooling/grove/tests/lifecycle
          - tooling/grove/probes
          - tooling/grove/tests/dispatch
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Root-level and exact: the lockfile lives at the workspace root, so
      # `npm ci` runs there once and hoists for every matrix leg. `ci` rather
      # than `install` — it fails on a lockfile that disagrees with the
      # manifests instead of quietly rewriting it.
      - name: Install the workspace
        run: npm ci

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test

      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: npm run typecheck
