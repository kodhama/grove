name: test

# Typecheck, tests and a secrets scan on every push to main and every PR.
# The job's name, `test`, is the check main's ruleset requires once it has
# first reported.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the older run; pushes to main
# each keep their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The pinned gitleaks binary with redacted output, over the commits this
      # run adds (gitleaks-action would need a licence on a private repo).
      # On a branch's first push `before` is all zeros, and a base missing from
      # the clone (a force-push orphaned it) would scan nothing and pass, so both
      # scan everything. `--remerge-diff` shows what each merge itself resolved,
      # so a secret only a conflict resolution adds is scanned, but not a PR's
      # test merge replaying main (`-m` would). Any `--log-opts` replaces
      # gitleaks' defaults, so the full scan restates them.
      - name: Secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          SECRETS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          if [ -z "${SECRETS_BASE}" ] || [ "${SECRETS_BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${SECRETS_BASE}^{commit}" 2>/dev/null; then
            /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="--remerge-diff --full-history --all --diff-filter=tuxdb"
          else
            /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="--remerge-diff ${SECRETS_BASE}..HEAD"
          fi
